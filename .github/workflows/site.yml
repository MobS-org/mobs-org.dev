name: Website

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://mobs-org-dev.pages.dev' }}
      - run: npm run check

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.CLOUDFLARE_DEPLOY_ENABLED == 'true'
    needs: check
    runs-on: ubuntu-latest
    steps:
      - name: Check deployment configuration
        id: cloudflare
        env:
          CF_DEPLOY_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_DEPLOY_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CF_DEPLOY_TOKEN" ] && [ -n "$CF_DEPLOY_ACCOUNT" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Pages deployment skipped: configure CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID to enable deployment."
          fi
      - uses: actions/checkout@v6
        if: steps.cloudflare.outputs.enabled == 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        if: steps.cloudflare.outputs.enabled == 'true'
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
        if: steps.cloudflare.outputs.enabled == 'true'
      - name: Build, check, and deploy
        if: steps.cloudflare.outputs.enabled == 'true'
        run: npm run deploy
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://mobs-org-dev.pages.dev' }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
